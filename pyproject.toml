[project]
name = "job-radar"
version = "0.1.0"
description = "Social Job Radar - collects job postings from social platforms, filters them, and delivers them via Telegram and a web dashboard"
readme = "README.md"
requires-python = ">=3.11"
# Phase 1 core is intentionally pure standard-library so it runs on a personal
# laptop with no paid services and no third-party data store (see SRS 2.3, DR-1).
dependencies = []

[project.scripts]
jobradar = "jobradar.cli:main"

[project.optional-dependencies]
# Only needed if you swap the stdlib collectors/dashboard for richer libraries.
# The shipped implementation does not require any of these.
extras = []

[tool.setuptools.packages.find]
where = ["."]
include = ["jobradar*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
