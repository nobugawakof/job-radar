# Job Radar — copy this to config.toml and fill in the two Telegram lines.
# That's all most people need; everything below has sensible defaults.

# --- Telegram (required) -------------------------------------------------
# Bot token from @BotFather. Chat id: message your bot, then open
# https://api.telegram.org/bot<YOUR_TOKEN>/getUpdates and read message.chat.id
telegram_bot_token = "PASTE-YOUR-BOT-TOKEN"
telegram_chat_id   = "PASTE-YOUR-CHAT-ID"

# --- What you want -------------------------------------------------------
keywords    = ["backend", "frontend", "fullstack", "ai"]   # send jobs matching any of these
remote_only = true                                          # only remote roles
regions     = []                                            # e.g. ["Hong Kong", "Worldwide"]; empty = anywhere
run_interval_hours = 4                                      # how often to check

# --- Optional: nicer messages via AI (costs money) -----------------------
use_ai = false
# anthropic_api_key = "sk-ant-..."   # only needed if use_ai = true

# --- Optional: API tokens (fill in only the ones you use) ----------------
# All tokens live here in the file — no environment variables needed.
# Reddit: create an app at https://www.reddit.com/prefs/apps (type "script").
# reddit_client_id     = ""
# reddit_client_secret = ""
# Twitter/X: requires a PAID X API plan (the free read tier was discontinued).
# x_bearer_token       = ""
#
# Facebook and TikTok are NOT supported: there is no working way to search
# public job posts on them (Facebook has no public post-search API at any price;
# TikTok's API is restricted to accredited academics). No token would help.

# --- Optional: extra job sources -----------------------------------------
# Leave this out to use the built-in sources (Bluesky, Hacker News,
# WeWorkRemotely) — they need no keys. Add a block to monitor something
# specific. The credentials above are used automatically.
#
# [[sources]]
# name = "reddit-forhire"
# type = "reddit"
# subreddit = "forhire"
#
# [[sources]]
# name = "x-hiring"
# type = "twitter"                 # needs x_bearer_token above (paid)
# query = "hiring remote developer -is:retweet"
