# Social Job Radar — Telegram-only configuration.
#
# Copy to config.toml and edit. Secrets do NOT belong here; set them in the
# environment instead:
#
#   export JOBRADAR_TELEGRAM_BOT_TOKEN=123456:ABC...   # from @BotFather
#   export JOBRADAR_TELEGRAM_CHAT_ID=987654321         # your chat/user id
#   export JOBRADAR_REDDIT_CLIENT_ID=...               # only if using Reddit
#   export JOBRADAR_REDDIT_CLIENT_SECRET=...
#
# (You may also put telegram_bot_token / telegram_chat_id here if you prefer,
#  but keep this file out of version control if you do.)

# What to look for.
keywords = ["web3", "web2", "backend", "frontend", "ai", "fullstack"]
remote_only = true

# How it runs.
state_path = "jobradar-state.json"     # the only persistence: remembers what was sent
run_interval_hours = 4
catchup_lookback_hours = 72            # cap how far back a source looks per run
default_request_interval_seconds = 5   # politeness: min gap between requests
tier_b_failure_threshold = 3           # auto-disable a scraper after N failures
max_sent_remembered = 5000             # bound the state file size

# --- Sources -------------------------------------------------------------
# Each [[sources]] block is one collector. `type` selects it; the remaining
# keys are passed to that collector.

[[sources]]
name = "bluesky-hiring"
type = "bluesky"
tier = "A"
query = "hiring remote developer"

[[sources]]
name = "hn-whoishiring"
type = "hn"
tier = "A"
query = "remote"
classifier_prior = 1.0                 # a jobs-only context; keep short posts

[[sources]]
name = "weworkremotely"
type = "rss"
tier = "A"
url = "https://weworkremotely.com/categories/remote-programming-jobs.rss"

[[sources]]
name = "reddit-forhire"
type = "reddit"
tier = "A"
subreddit = "forhire"
listing = "new"

[[sources]]
name = "tg-remotejobs"
type = "telegram"
tier = "A"
channel = "remotejobs"                 # a channel the bot has been added to

# Tier B — best-effort HTML scrape; expected to break, auto-disables after 3
# consecutive failures. Off by default; enable knowingly.
[[sources]]
name = "example-scrape"
type = "scrape"
tier = "B"
enabled = false
url = "https://example.com/jobs"
block_pattern = "<article[^>]*>(.*?)</article>"
