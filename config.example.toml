# Job Radar — the only config file. Copy to config.toml and edit.
# Fill in the two Telegram lines and the sites you want; the rest has defaults.

# --- Telegram (required) -------------------------------------------------
# Bot token from @BotFather. Chat id: message your bot, then open
# https://api.telegram.org/bot<YOUR_TOKEN>/getUpdates and read message.chat.id
# (must be a chat the bot can post in — press Start in your DM with the bot).
telegram_bot_token = "PASTE-YOUR-BOT-TOKEN"
telegram_chat_id   = "PASTE-YOUR-CHAT-ID"

# --- Sites to search -----------------------------------------------------
# Just list the sites. Each URL is turned into the right source automatically.
# The en/cn split is only for your own tidiness — both are searched together.
en = [
  "news.ycombinator.com",       # HN "Who is hiring?" monthly thread
  "weworkremotely.com",
  "reddit.com/r/forhire",       # public RSS feed — no key needed
  "reddit.com/r/remotejs",      # remote JavaScript/web jobs
  "reddit.com/r/remotepython",  # remote Python jobs
  "reddit.com/r/RemoteJobs",    # general remote jobs
  # "x.com",                    # needs x_bearer_token below (paid X API)
]
cn = [
  "v2ex.com",                 # V2EX 酷工作 + 远程
  "ruby-china.org",
]

# --- What you want -------------------------------------------------------
# At least one keyword must appear in a posting. Broad by default so you don't
# miss roles worded differently; trim this to narrow the results. (Empty = send
# everything that passes the remote/region/salary filters.) English keywords
# also match common Chinese equivalents (engineer↔工程师, developer↔开发, etc.).
keywords = [
  "engineer", "developer", "programmer", "software",
  "backend", "frontend", "fullstack", "web", "mobile",
  "python", "javascript", "typescript", "react", "node", "golang", "java", "rust",
  "devops", "data", "ai", "designer",
  "工程师", "开发", "程序员", "后端", "前端", "远程",
]

# Drop whole role categories even if they match a keyword above. Handy for
# "engineering only" — a marketing/growth post that says "data-driven" won't
# sneak in via the "data" keyword. Empty = keep everything that matched.
exclude_keywords = [
  # "marketing", "growth", "sales", "designer", "recruiter", "community",
  # "市场推广", "用户增长", "增长", "运营", "销售", "招商", "客服", "设计师",
]
remote_only = true
regions     = []            # e.g. ["Malaysia", "APAC", "中国"]; groupings like EU/APAC work; empty = anywhere
unknown_location = "review"  # jobs that don't say where they hire: "review" (ask me) / "send" / "drop"
run_interval_hours = 4
auto_run = false             # dashboard only: check automatically (the dashboard's switch)
max_posting_age_days = 15    # ignore anything older than N days (0 = no limit)
repost_window_days   = 60    # don't re-send a reworded repost of a job sent within N days (0 = off)

# --- Salary filter (approximate; 0 / false = off) ------------------------
min_salary_usd = 0          # drop postings whose pay looks below this (annual USD est.)
require_salary = false      # true = only send postings that state a salary

# --- Optional: nicer messages via AI -------------------------------------
# Splits each job into clean Responsibilities / Requirements. Off by default;
# the bot works fully without it. Pick a provider:
#   gemini  -> Google, has a FREE tier. Get a key at aistudio.google.com/apikey
#   claude  -> Anthropic. Paid (needs credits at console.anthropic.com).
use_ai      = false
ai_provider = "gemini"              # "gemini" (free tier) or "claude" (paid)
# --- if ai_provider = "gemini" (free):
# ai_model      = "gemini-2.5-flash"
# gemini_api_key = "AIza..."
# --- if ai_provider = "claude" (paid):
# ai_model         = "claude-haiku-5-5"   # or "claude-opus-5-5"
# anthropic_api_key = "sk-ant-..."

# --- Optional: auto-apply ------------------------------------------------
# Sends an application (message + your résumé PDF) to the contact a posting
# names — a Telegram handle (from YOUR Telegram account) or an email address.
# Start with "dry_run": every draft is shown to you in your bot chat and nobody
# is contacted. Switch to "auto" once the drafts look right.
# See README → "Auto-apply" before turning it on.
apply_mode     = "off"                   # "off" | "dry_run" | "auto"
apply_channels = ["telegram", "email"]   # tried in this order
applicant_name = ""                      # signs the message
# Let other devices (phone on your Wi-Fi, or via Tailscale) open the dashboard.
# People log in there; anyone who can reach it can create an account.
# Applies when Job Radar restarts. See README → "Open the dashboard on your phone".
web_allow_network = false

# Your résumé is made from your Profile (dashboard → Profile), tailored to each
# job when AI is on. "uploaded" sends your own resume.pdf instead.
resume_source    = "generated"           # "generated" | "uploaded"
resume_font_path = ""                    # font for the generated PDF; empty = find one on this computer
resume_page_size = "letter"              # "letter" | "a4" | "auto" (Letter for US/Canada jobs, else A4)
resume_max_pages = 2                     # warn when a résumé runs longer (0 = no limit)
resume_pdf_path  = "resume.pdf"          # your own PDF ("uploaded", or a fallback)
resume_text_path = ""                    # optional plain-text résumé for the AI; else it reads the PDF

# Which postings to apply to. With use_ai = true, the AI scores each posting
# against your résumé and only applies at or above apply_min_score. With AI
# off, apply_keywords is REQUIRED (nothing is applied to without it).
apply_min_score        = 70              # 0-100
apply_keywords         = []              # e.g. ["python", "backend", "后端"]
apply_exclude_keywords = []              # e.g. ["senior", "lead", "on-site"]

# Safety rails — keep these conservative: messaging strangers too often gets a
# Telegram account restricted.
apply_daily_cap             = 10         # applications per rolling 24h
apply_delay_seconds         = [45, 120]  # random gap between sends
apply_contact_cooldown_days = 30         # never message the same person twice within this
apply_max_age_days          = 7          # don't apply to postings older than this

# Language of applications, replies and bot notices:
# "zh" = Chinese (default), "en" = English, "auto" = the job post's language.
message_language = "zh"

# Used when AI is off (or fails while apply_keywords is set). {title} {name}
# apply_template_zh = "您好！我在贵司发布的「{title}」职位信息中看到了招聘需求，希望应聘该职位。..."
# apply_email_subject_zh = "应聘：{title}"
# apply_template = "Hi! I saw your post for {title} and would like to apply. ..."
# apply_email_subject = "Application: {title}"

# Your own Telegram account (a bot can't DM people). Get api_id / api_hash at
# https://my.telegram.org → API development tools, then run once:
#   pip install telethon
#   python -m jobradar.cli --config config.toml telegram-login
# telegram_api_id   = "1234567"
# telegram_api_hash = "..."
# telegram_phone    = "+60123456789"
# telegram_session_path = "jobradar-user.session"   # KEEP PRIVATE: full account access

# Email (SMTP). Gmail: smtp.gmail.com, port 587, and an App Password
# (Google Account → Security → App passwords), not your normal password.
# smtp_host     = "smtp.gmail.com"
# smtp_port     = 587
# smtp_ssl      = false                  # true for port 465
# smtp_user     = "you@gmail.com"
# smtp_password = "app-password"
# smtp_from     = "you@gmail.com"

# --- Optional: API tokens (only for the sources that need them) ----------
# Reddit works out of the box via its public RSS feed — no key needed. Only set
# these if you add an explicit [[sources]] block of type "reddit" for the full
# Data API (create a "script" app at https://www.reddit.com/prefs/apps).
# reddit_client_id     = ""
# reddit_client_secret = ""
# Twitter/X: requires a PAID X API plan (free read tier was discontinued).
# x_bearer_token       = ""

# Not supported (no free way to read their job posts): BOSS直聘 (zhipin), 拉勾
# (lagou), 猎聘 (liepin), 智联 (zhaopin), Weibo, Douban, LinkedIn. Listing one in
# en/cn just logs a skip.

# --- Advanced: custom sources --------------------------------------------
# For a specific RSS feed or a best-effort scrape, add [[sources]] blocks (these
# are used in addition to the en/cn lists):
#
# [[sources]]
# name = "some-feed"
# type = "rss"
# url  = "https://example.com/jobs.rss"
