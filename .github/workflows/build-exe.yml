name: build-exe

# Builds the Windows executable and uploads it as a downloadable artifact.
# Runs on every push to the branch and can be started by hand from the Actions
# tab (workflow_dispatch). Also attaches the .exe to any tagged release.

on:
  push:
    branches: ["**"]
    paths:
      - "jobradar/**"
      - "jobradar.spec"
      - "build.py"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch: {}
  release:
    types: [created]

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build jobradar.exe
        run: python -m PyInstaller --clean --noconfirm jobradar.spec

      - name: Package with example config
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist/jobradar.exe package/
          Copy-Item config.example.toml package/config.toml
          Copy-Item README.md package/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jobradar-windows
          path: package/
          if-no-files-found: error
